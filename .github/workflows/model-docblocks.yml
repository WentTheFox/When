name: Model docblocks

# The @property docblocks at the top of each model are generated by barryvdh/laravel-ide-helper
# from the migrated test database, and PHPStan (Larastan) reads its column types from them.
# This regenerates them exactly as documented in CLAUDE.md (ide-helper:models --write, then pint)
# and fails if that changes anything, i.e. a migration or model change landed without them.
# To fix a failure locally:
#   php artisan migrate --env=testing
#   php artisan ide-helper:models --write --env=testing
#   ./vendor/bin/pint app/Models
on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-docblocks:
    runs-on: ubuntu-latest
    # .env.testing is gitignored, so the test database is configured here instead (the same values as
    # phpunit.xml). The key is a throwaway: nothing is encrypted or kept.
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: whenthefox_test
      DB_USERNAME: postgres
      DB_PASSWORD: ''
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: whenthefox_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate the test database
        run: php artisan migrate --env=testing --force

      - name: Regenerate model docblocks
        run: |
          php artisan ide-helper:models --write --env=testing
          ./vendor/bin/pint app/Models

      - name: Fail if the docblocks were out of date
        run: |
          if ! git diff --exit-code -- app/Models; then
            echo "::error::Model docblocks are out of date. Run: php artisan migrate --env=testing && php artisan ide-helper:models --write --env=testing && ./vendor/bin/pint app/Models"
            exit 1
          fi
