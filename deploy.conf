# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# Same steps, same conditional-on-changed-files logic, just split across
# deploy_build/deploy_restart to fit the shared hook's contract. See that
# file's git history if this ever needs to be cross-checked against the
# original.

# Zero-downtime mode (git-deploy-toolkit RELEASES=1, see its docs/releases.md and
# docs/zero-downtime-deploy.md here): the toolkit builds a fresh release dir
# ($RELEASE, with .env and storage linked in via SHARED) while the old release
# keeps serving, swaps the WORKTREE symlink, then runs deploy_restart. In that
# mode this file never uses `artisan down`: the last step of deploy_build
# raises the read-only flag (storage/framework/readonly, a plain file so it
# needs no PHP), deploy_restart migrates against the already-live new code,
# restarts the workers, checks /status and only then lowers the flag. A failed
# migrate or health check leaves the flag ON on purpose (reads keep working,
# writes get 503) - fix forward or roll back, then `php artisan app:readonly
# off`. Without release dirs ($RELEASE equal to $WORKTREE, in-place mode) the
# original down/up flow below is used unchanged. Migrations must be
# expand-only relative to the previous release.

READONLY_FLAG="storage/framework/readonly"

# Paths linked from <WORKTREE>.d/shared into every release (only read by the toolkit when RELEASES=1).
SHARED=(.env storage)

# Release-directory mode: the toolkit builds into $RELEASE while $WORKTREE (a symlink after the swap) still
# points at the old release. In in-place mode the toolkit sets both to the same path. Comparing the two is
# correct from the very first deploy, unlike testing whether $WORKTREE is a symlink yet.
releases_mode() {
  [[ "${RELEASE:-$WORKTREE}" != "$WORKTREE" ]]
}

# Reloads php-fpm so opcache picks up the swapped release. The unit is whichever single php*-fpm.service is
# installed (the sudoers/services rule only permits `reload php*-fpm.service`); PHP_FPM_SERVICE overrides it.
reload_php_fpm() {
  local unit="${PHP_FPM_SERVICE:-}"
  if [[ -z "$unit" ]]; then
    local units
    units=$(systemctl list-units --plain --no-legend --state=active 'php*-fpm.service' | awk '{print $1}')
    if [[ -n "$units" && "$units" != *$'\n'* ]]; then
      unit="${units%.service}"
    fi
  fi
  if [[ -z "$unit" ]]; then
    echo "git-deploy: no single php-fpm unit found, skipping php-fpm reload (set PHP_FPM_SERVICE)" >&2
    return 0
  fi
  echo "git-deploy: reloading ${unit%.service}.service"
  sudo -n /usr/local/lib/git-deploy/git-deploy-service reload "${unit%.service}.service"
}

# Probes the JSON variant of GET /status on the app's own APP_URL (override with HEALTH_URL)
health_check() {
  local url="${HEALTH_URL:-}"
  if [[ -z "$url" ]]; then
    url="$(grep -E '^APP_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"')/status"
  fi
  local attempt
  for attempt in 1 2 3 4 5; do
    if curl -fsS --max-time 10 -H "Accept: application/json" "$url" > /dev/null; then
      echo "git-deploy: health check passed ($url)"
      return 0
    fi
    sleep 3
  done
  echo "git-deploy: health check FAILED ($url)" >&2
  return 1
}

deploy_build() {
  WAS_ALREADY_DOWN=0
  [[ -f storage/framework/down ]] && WAS_ALREADY_DOWN=1
  BUILD_FAILED=0

  local changed_files=""
  if [[ "$oldrev" != "0000000000000000000000000000000000000000" ]]; then
    changed_files=$(git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev")
  fi

  # A fresh release dir has no vendor/ or node_modules, so always install there
  if releases_mode || [[ -z "$changed_files" ]] || grep -q "^composer\.lock" <<< "$changed_files"; then
    composer install --optimize-autoloader --no-dev --no-interaction
  else
    echo "git-deploy: skipping composer install, lockfile not modified"
  fi

  if ! releases_mode; then
    # Only take the site down ourselves if it wasn't already (e.g. someone put
    # it in maintenance mode by hand with --secret for an IP-less bypass link)
    # — don't overwrite that bypass, and don't bring it back up at the end
    # either in that case.
    if [[ "$WAS_ALREADY_DOWN" -eq 0 ]]; then
      php artisan down
    else
      echo "git-deploy: already in maintenance mode, leaving it as-is"
    fi

    php artisan migrate --force
  fi

  # Fonts live in storage/app/public/fonts, which is shared between releases, so release mode only refetches
  # when what feeds them changed.
  if [[ -z "$changed_files" ]] || grep -qE "^composer\.lock|^config/google-fonts\.php" <<< "$changed_files"; then
    php artisan google-fonts:fetch
  else
    echo "git-deploy: skipping Google Fonts fetch, nothing relevant changed"
  fi

  if releases_mode || [[ -z "$changed_files" ]] || grep -q "^pnpm-lock\.yaml" <<< "$changed_files"; then
    pnpm install --frozen-lockfile
  else
    echo "git-deploy: skipping pnpm install, lockfile not modified"
  fi

  if releases_mode; then
    # public/storage is untracked, so a fresh release has none and nginx couldn't serve /storage/*. Not
    # `artisan storage:link`: that points at this release's own real path, which is gone once the release is
    # pruned. Going through the stable $WORKTREE symlink survives every later release.
    ln -sfn "$WORKTREE/storage/app/public" "$RELEASE/public/storage"

    # The old release is still live, so a failed build must abort the deploy (set -e)
    pnpm build
  else
    # Build failure isn't fatal here on purpose: still optimize/restart/come
    # back up with whatever assets are already on disk, and only fail the
    # deploy (via deploy_restart's exit status) at the very end — a broken
    # build shouldn't leave the site stuck in maintenance mode.
    if [[ -z "$changed_files" ]] || grep -qE "^resources/|^lang/|^pnpm-lock\.yaml" <<< "$changed_files"; then
      if pnpm build; then
        echo "git-deploy: build successful"
      else
        echo "git-deploy: build failed" >&2
        BUILD_FAILED=1
      fi
    else
      echo "git-deploy: skipping build, no changes in resources/ folder"
    fi
  fi

  php artisan optimize

  # Deploys run as the deploy user (the git-push user), but when-horizon.service and
  # php-fpm run as www-data — it is in www-data's group but not vice versa,
  # so files/dirs regenerated here as the deploy user can end up unwritable by www-data.
  # Hit for real: every RecomputeShareLinkAvailability job failed for ~2
  # weeks because storage/logs/availability.log was owned by the deploy user and the queue
  # worker (www-data) couldn't write to it — same bug class as
  # SledgeHammerTime/Luna, see git-deploy-toolkit's CLAUDE.md pitfalls.
  # Reasserting on every deploy so it can't silently regress again.
  sudo -n /usr/local/lib/git-deploy/git-deploy-fixperms "${RELEASE:-$WORKTREE}" storage bootstrap/cache

  if releases_mode; then
    # Last on purpose: nothing after this can fail the build with the flag raised. storage/ is shared, so the old
    # release sees the file too but doesn't know it; the new one honours it right after the swap.
    mkdir -p "$(dirname "$READONLY_FLAG")"
    touch "$READONLY_FLAG"
  fi
}

deploy_restart() {
  if releases_mode; then
    reload_php_fpm
    # The new code is live and read-only; bring the schema up to date
    php artisan migrate --force
  fi

  sudo -n /usr/local/lib/git-deploy/git-deploy-service restart when-horizon.service

  if releases_mode; then
    health_check
    rm -f "$READONLY_FLAG"
    return 0
  fi

  if [[ "$WAS_ALREADY_DOWN" -eq 0 ]]; then
    php artisan up
  else
    echo "git-deploy: was already in maintenance mode before this deploy started, leaving it down"
  fi

  [[ "$BUILD_FAILED" -eq 0 ]]
}

# git-deploy-rollback: the toolkit has already re-pointed the symlink. Never runs deploy_restart (it
# migrates) and never touches the flag or the schema, so only reload what serves the code.
deploy_rollback() {
  reload_php_fpm
  sudo -n /usr/local/lib/git-deploy/git-deploy-service restart when-horizon.service
}
